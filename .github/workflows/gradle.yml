name: Java CI

on: [push]

permissions:
  contents: write

jobs:
  build:
    if: "! contains(toJSON(github.event.commits.*.message), '[SKIP-CI]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: WorldGuard
          path: worldguard-bukkit/build/libs/worldguard-bukkit-*-dist.jar

  prerelease:
    needs: build
    if: github.ref == 'refs/heads/7.0.x'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorldGuard
          path: dist

      - name: Build translator archive
        run: |
          JAR=$(ls dist/worldguard-bukkit-*-dist.jar)
          mkdir -p wgtranslator/WorldGuard
          cp "$JAR" wgtranslator/
          curl -sSL -o wgtranslator/WorldGuard/translator-commands.yml https://gist.githubusercontent.com/imDaniX/7a23930c29c05fd7b7a4687d6ccafc7b/raw/translator-commands.yml
          curl -sSL -o wgtranslator/WorldGuard/translator.yml https://gist.githubusercontent.com/imDaniX/7a23930c29c05fd7b7a4687d6ccafc7b/raw/translator.yml
          cd wgtranslator
          zip -r ../WGTranslator-Russian.zip .

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.x-tr-live
          name: 7.0.x Live
          body: |
            Changes from the last commit

            [${{ github.sha }}](${{ github.event.head_commit.url }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/worldguard-bukkit-*-dist.jar
            WGTranslator-Russian.zip
